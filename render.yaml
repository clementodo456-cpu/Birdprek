services:
  - type: worker
    name: daily-motivation-bot
    env: python
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_PATH
        value: /var/data/motivation_bot.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
